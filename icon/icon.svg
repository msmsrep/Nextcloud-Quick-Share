<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nextcloud-Quick-Share のアイコン。
  参考1〜3 と同じ作り: 濃紺のライン画 + 右下にずらした一色のパステル面。
  アクセント色は参考と重複しないアンバー (#F2C57C)。
    参考1 グリーン  #A5D5A6
    参考2 ピンク    #E49DA6
    参考3 ペリウィンクル #9FA8DA
-->
<!-- viewBox は図柄の外接矩形（線幅とパステル面のずれ込み）に合わせて詰めてある。
     16px でも潰れないよう余白を最小限にするため。 -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="5 2.5 94 94">
  <defs>
    <path id="nqs-cloud"
          d="M32 74
             C22 74 14 66 14 56.5
             C14 47.5 21 40 30 39.2
             C32 29 41 21 51.5 21
             C62 21 71 28.8 72.6 39
             C81 40.5 87 47.6 87 56
             C87 65.6 79.5 74 70 74
             Z" />
  </defs>

  <!-- 右下へずらしたパステル面（ライン画の内側からのぞく） -->
  <use href="#nqs-cloud" x="7" y="8" fill="#F2C57C" />

  <!-- ライン画 -->
  <g fill="none" stroke="#18193F" stroke-width="8"
     stroke-linecap="round" stroke-linejoin="round">
    <use href="#nqs-cloud" />
    <path d="M50.5 68 L50.5 39.5" />
    <path d="M39 51 L50.5 39.5 L62 51" />
  </g>
</svg>
