<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextcloud-Quick-Share</title>
    <style>
      /* 配色はアイコンとストア掲載画像に合わせている。
         ネイビー #18193F / アンバー #F2C57C / クリーム #FAF3E8 の 3 色。
         ポップアップはブラウザのテーマに従うため、明暗の両方を用意する。 */
      :root {
        color-scheme: light dark;
        --fg: #18193f;         /* アイコンのライン画と同じネイビー */
        --bg: #ffffff;
        --tint: #faf3e8;       /* ストア画像の背景と同じクリーム */
        --muted: #45466a;
        --border: #ddd2bd;      /* 仕切り線などの装飾 */
        --field: #9c8a6b;       /* 入力欄の枠。背景との比 3:1 以上を確保する */
        --accent: #d99b2b;     /* 文字や細い線に使う濃いめのアンバー */
        --accent-fill: #f2c57c; /* 面で使うアイコンと同じアンバー */
        --ring: rgba(217, 155, 43, 0.45);
        --primary: #18193f;
        --primary-fg: #ffffff;
        --primary-hover: #2a2b5c;
        --ok: #0a5c29;
        --ok-bg: rgba(10, 92, 41, 0.08);
        --err: #a3001d;
        --err-bg: rgba(163, 0, 29, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          /* 暗い側はネイビーを背景に回し、アンバーを主役の色にする */
          --fg: #f6f3ec;
          --bg: #16173a;
          --tint: #232456;
          --muted: #c3c4de;
          --border: #3d3f70;
          --field: #7a7cb0;
          --accent: #f2c57c;
          --accent-fill: #f2c57c;
          --ring: rgba(242, 197, 124, 0.45);
          --primary: #f2c57c;
          --primary-fg: #16173a;
          --primary-hover: #f8d69a;
          --ok: #8ef0b8;
          --ok-bg: rgba(142, 240, 184, 0.12);
          --err: #ffb0bb;
          --err-bg: rgba(255, 176, 187, 0.12);
        }
      }

      body {
        /* Segoe UI は日本語を持たないので、和文は次の Meiryo に落ちる。
           Yu Gothic UI は小さい字で線が細くなり読みにくいため避ける。 */
        font-family: "Segoe UI", Meiryo, "Hiragino Sans", "Noto Sans JP", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        width: 300px;
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
      }

      /* --- ヘッダー（アイコンと同じ図柄を並べる） --- */
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 14px;
        background: var(--tint);
        border-bottom: 1px solid var(--border);
      }
      .mark {
        flex: none;
        width: 28px;
        height: 28px;
      }
      header h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
      }
      header p {
        margin: 1px 0 0;
        font-size: 12px;
        line-height: 1.3;
        color: var(--muted);
      }

      main {
        padding: 14px;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
      }
      label:first-child {
        margin-top: 0;
      }
      input {
        width: 100%;
        margin-top: 5px;
        padding: 8px 9px;
        box-sizing: border-box;
        /* label の中にあるので、font:inherit だけだとラベルの太字を受け継ぐ */
        font: inherit;
        font-size: 14px;
        font-weight: 400;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--field);
        border-radius: 6px;
      }
      input:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }

      button {
        margin-top: 16px;
        width: 100%;
        padding: 11px;
        font: inherit;
        font-weight: 700;
        color: var(--primary-fg);
        background: var(--primary);
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring);
      }

      /* 主役ではないボタン（コピー・削除）は輪郭だけにする */
      #copyBtn,
      #originList button {
        color: var(--fg);
        background: transparent;
        border-color: var(--field);
        font-weight: 600;
      }
      #copyBtn:hover,
      #originList button:hover {
        background: var(--tint);
        border-color: var(--accent);
      }

      /* --- 実行結果 / 警告 ---
         文字色は状態色ではなく本文色のままにして読みやすさを優先し、
         状態は左の線と下地の色で示す。 */
      #status {
        margin-top: 12px;
        padding: 9px 11px;
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: normal;
        overflow-wrap: anywhere; /* 長い URL だけ折り返す。和文は自然に折る */
        background: var(--tint);
        border-left: 4px solid var(--accent-fill);
        border-radius: 0 6px 6px 0;
      }
      /* 空のときに枠だけ残らないようにする（popup.js は textContent を空にする） */
      #status:empty {
        display: none;
      }
      #status.error {
        background: var(--err-bg);
        border-left-color: var(--err);
      }
      #status.ok {
        background: var(--ok-bg);
        border-left-color: var(--ok);
      }

      #result {
        display: none;
        margin-top: 10px;
      }
      #result input {
        font-size: 13px;
        background: var(--tint);
      }
      #result button {
        margin-top: 6px;
        padding: 8px;
      }

      #origins {
        display: none;
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      #origins h4 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      #originList {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #originList li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        font-size: 13px;
      }
      #originList span {
        flex: 1;
        word-break: normal;
        overflow-wrap: anywhere;
      }
      #originList button {
        margin-top: 0;
        width: auto;
        flex: none;
        padding: 3px 10px;
        font-size: 12px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <!-- icon/icon.svg と同じ図柄。ストア画像は外部参照を読み込めないため、
           <use> や <img> ではなくパスを直接書いて自己完結させている。
           ライン画は currentColor にして暗いテーマでも見えるようにする。 -->
      <svg class="mark" viewBox="5 2.5 94 94" aria-hidden="true" focusable="false">
        <path
          transform="translate(7 8)"
          fill="#f2c57c"
          d="M32 74 C22 74 14 66 14 56.5 C14 47.5 21 40 30 39.2 C32 29 41 21 51.5 21 C62 21 71 28.8 72.6 39 C81 40.5 87 47.6 87 56 C87 65.6 79.5 74 70 74 Z"
        />
        <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 74 C22 74 14 66 14 56.5 C14 47.5 21 40 30 39.2 C32 29 41 21 51.5 21 C62 21 71 28.8 72.6 39 C81 40.5 87 47.6 87 56 C87 65.6 79.5 74 70 74 Z" />
          <path d="M50.5 68 L50.5 39.5" />
          <path d="M39 51 L50.5 39.5 L62 51" />
        </g>
      </svg>
      <div>
        <h3>Nextcloud Quick Share</h3>
        <p>アップロード設定</p>
      </div>
    </header>

    <main>
      <label>
        パスワード（任意）
        <input type="password" id="password" autocomplete="new-password" />
      </label>

      <label>
        有効期限（既定は 1 週間後 / 空欄で無期限）
        <input type="date" id="expireDate" />
      </label>

      <button id="runBtn">アップロードする</button>

      <div id="status"></div>

      <div id="result">
        <input type="text" id="shareUrl" readonly />
        <button id="copyBtn">共有URLをコピー</button>
      </div>

      <div id="origins">
        <h4>登録済みサイト</h4>
        <ul id="originList"></ul>
      </div>
    </main>

    <!-- uploader.js はページへ注入する関数を定義する。popup.js より前に読む。 -->
    <script src="uploader.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
