<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nextcloud-Quick-Share</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 12px;
        width: 280px;
        margin: 0;
      }
      h3 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 13px;
      }
      input {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #status.error {
        color: #b00020;
      }
      #status.ok {
        color: #0b6b2f;
      }
      #result {
        display: none;
        margin-top: 8px;
      }
      #result button {
        margin-top: 6px;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h3>アップロード設定</h3>

    <label>
      パスワード（任意）
      <input type="password" id="password" autocomplete="new-password" />
    </label>

    <label>
      有効期限（任意）
      <input type="date" id="expireDate" />
    </label>

    <button id="runBtn">アップロードする</button>

    <div id="status"></div>

    <div id="result">
      <input type="text" id="shareUrl" readonly />
      <button id="copyBtn">共有URLをコピー</button>
    </div>

    <!-- uploader.js はページへ注入する関数を定義する。popup.js より前に読む。 -->
    <script src="uploader.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
